<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" font-family="Instrument Sans, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="The 4Ps: Purpose at the foundation, then Plan, People, and Pride at the peak. Each level governs the ones above it; each level can only influence the ones below it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1b2a4a"/></marker><marker id="aht" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0e7c7b"/></marker></defs>

<rect x="185.0" y="20" width="230" height="64" rx="32.0" fill="#0e7c7b"/>
<text x="300" y="61" text-anchor="middle" font-size="26" font-weight="600" fill="#fff">Pride &#183; Peak</text>
<rect x="140.0" y="96" width="320" height="64" rx="32.0" fill="#1b2a4a"/>
<text x="300" y="137" text-anchor="middle" font-size="26" font-weight="600" fill="#fff">People</text>
<rect x="95.0" y="172" width="410" height="64" rx="32.0" fill="#1b2a4a"/>
<text x="300" y="213" text-anchor="middle" font-size="26" font-weight="600" fill="#fff">Plan</text>
<rect x="50.0" y="248" width="500" height="64" rx="32.0" fill="#1b2a4a"/>
<text x="300" y="289" text-anchor="middle" font-size="26" font-weight="600" fill="#fff">Purpose &#183; Foundation</text>
<line x1="22" y1="306" x2="22" y2="40" stroke="#1b2a4a" stroke-width="4" marker-end="url(#ah)"/>
<line x1="578" y1="26" x2="578" y2="292" stroke="#0e7c7b" stroke-width="4" marker-end="url(#aht)"/>
<text x="22" y="368" text-anchor="start" font-size="24" font-weight="600" fill="#1b2a4a">&#8593; Governs</text><text x="22" y="401" text-anchor="start" font-size="21" fill="#2a3d63">Each level sets the limits for everything</text><text x="22" y="430" text-anchor="start" font-size="21" fill="#2a3d63">above it. Plan can be no clearer than Purpose.</text>
<text x="22" y="486" text-anchor="start" font-size="24" font-weight="600" fill="#0e7c7b">&#8595; Influences</text><text x="22" y="519" text-anchor="start" font-size="21" fill="#2a3d63">Each level can only influence the ones below it.</text><text x="22" y="548" text-anchor="start" font-size="21" fill="#2a3d63">A proud team tightens its own standards.</text>
</svg>