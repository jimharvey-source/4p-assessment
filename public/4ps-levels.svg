<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Instrument Sans, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="The 4Ps: Purpose at the foundation, then Plan, People, and Pride at the peak. Each level governs the ones above it; each level can only influence the ones below it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1b2a4a"/></marker><marker id="aht" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0e7c7b"/></marker></defs>
<rect width="1200" height="660" fill="#f6f8fb"/>
<text x="600" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6b7f">The 4Ps</text>
<text x="600" y="104" text-anchor="middle" font-size="32" font-weight="600" fill="#1b2a4a" letter-spacing="-0.8">Built from the bottom. Reinforced from the top.</text>
<rect x="450.0" y="170" width="300" height="78" rx="39.0" fill="#0e7c7b"/>
<text x="600" y="203" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Pride &#183; Peak</text>
<text x="600" y="226" text-anchor="middle" font-size="14" fill="#fff" fill-opacity="0.85">Do we actually care? How does it show?</text>
<rect x="380.0" y="260" width="440" height="78" rx="39.0" fill="#1b2a4a"/>
<text x="600" y="293" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">People</text>
<text x="600" y="316" text-anchor="middle" font-size="14" fill="#fff" fill-opacity="0.85">How do we hold ourselves to the right standards?</text>
<rect x="310.0" y="350" width="580" height="78" rx="39.0" fill="#1b2a4a"/>
<text x="600" y="383" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Plan</text>
<text x="600" y="406" text-anchor="middle" font-size="14" fill="#fff" fill-opacity="0.85">How are we going to get there?</text>
<rect x="240.0" y="440" width="720" height="78" rx="39.0" fill="#1b2a4a"/>
<text x="600" y="473" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Purpose &#183; Foundation</text>
<text x="600" y="496" text-anchor="middle" font-size="14" fill="#fff" fill-opacity="0.85">Where are we headed, and why does it matter?</text>
<line x1="200" y1="512" x2="200" y2="190" stroke="#1b2a4a" stroke-width="3" marker-end="url(#ah)"/>
<text x="178" y="294.0" text-anchor="end" font-size="17" font-weight="600" fill="#1b2a4a">Governs</text><text x="178" y="320.0" text-anchor="end" font-size="14" fill="#2a3d63">Each level sets</text><text x="178" y="340.0" text-anchor="end" font-size="14" fill="#2a3d63">the limits for</text><text x="178" y="360.0" text-anchor="end" font-size="14" fill="#2a3d63">everything above it.</text><text x="178" y="380.0" text-anchor="end" font-size="14" fill="#2a3d63">Plan can be no clearer</text><text x="178" y="400.0" text-anchor="end" font-size="14" fill="#2a3d63">than Purpose.</text>
<line x1="1000" y1="176" x2="1000" y2="498" stroke="#0e7c7b" stroke-width="3" marker-end="url(#aht)"/>
<text x="1022" y="294.0" text-anchor="start" font-size="17" font-weight="600" fill="#0e7c7b">Influences</text><text x="1022" y="320.0" text-anchor="start" font-size="14" fill="#2a3d63">Each level can only</text><text x="1022" y="340.0" text-anchor="start" font-size="14" fill="#2a3d63">influence the ones</text><text x="1022" y="360.0" text-anchor="start" font-size="14" fill="#2a3d63">below it. A proud team</text><text x="1022" y="380.0" text-anchor="start" font-size="14" fill="#2a3d63">tightens its own</text><text x="1022" y="400.0" text-anchor="start" font-size="14" fill="#2a3d63">standards and process.</text>
<line x1="240" y1="566" x2="960" y2="566" stroke="#e2e7ee" stroke-width="1"/>
<text x="600" y="604" text-anchor="middle" font-size="18" font-weight="600" fill="#1b2a4a">Symptoms show at the peak. Causes sit in the foundation.</text>
<text x="600" y="632" text-anchor="middle" font-size="15" fill="#2a3d63">So start with the lowest layer that is not holding. Everything above it rests on it.</text>
</svg>